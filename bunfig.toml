# The suite's subagent roots are process-wide, so they are redirected for the
# whole run rather than per file: tests/preload-subagent-roots.ts sets
# PI_SUBAGENT_WT_ROOT, PI_SUBAGENT_META_DIR and PI_SUBAGENT_CARGO_HOME to fresh
# temp dirs before any test file loads, and removes them on exit.
[test]
preload = ["./tests/preload-subagent-roots.ts"]
